<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zufallsgenerator</title><style>
:root{--ink:#17213b;--muted:#69748b;--line:#dfe5f1;--purple:#6d5ce7;--purple2:#914de2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,ui-rounded,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(145deg,#eef2ff,#faf5ff 48%,#ecfeff);overflow-x:hidden}body:before,body:after{content:"";position:fixed;width:430px;height:430px;border-radius:50%;filter:blur(35px);z-index:-1;animation:float 9s ease-in-out infinite alternate}body:before{left:-120px;top:-130px;background:rgba(117,98,231,.19)}body:after{right:-130px;bottom:-150px;background:rgba(34,211,238,.2);animation-delay:-3s}@keyframes float{to{transform:translate(28px,35px) scale(1.08)}}.shell{width:min(100%,620px);padding:10px}.head{text-align:center;margin-bottom:24px}.badge{display:inline-block;margin-bottom:13px;padding:6px 11px;border:1px solid rgba(109,92,231,.16);border-radius:999px;color:#6553cf;background:rgba(255,255,255,.65);font-size:12px;font-weight:850;letter-spacing:.11em;text-transform:uppercase}.logo{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 15px;border-radius:21px;color:#fff;font-size:29px;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 14px 32px rgba(109,92,231,.3);transform:rotate(-3deg)}h1{margin:0;font-size:clamp(30px,7vw,46px);letter-spacing:-.055em}p{margin:9px 0 0;color:var(--muted)}.app{padding:10px;border:1px solid rgba(255,255,255,.7);border-radius:30px;background:rgba(255,255,255,.75);box-shadow:0 28px 80px rgba(49,58,91,.14);backdrop-filter:blur(22px)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:6px;border-radius:20px;background:#edf0f8}.tab{margin:0;padding:12px;border:0;border-radius:15px;background:transparent;color:#70798d;font:inherit;font-weight:800;cursor:pointer}.tab.active{color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 7px 18px rgba(109,92,231,.24)}}.panel{padding:25px 20px 20px}.panel[hidden]{display:none}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:8px;color:#4a556d;font-size:14px;font-weight:800}input,textarea{width:100%;border:1px solid var(--line);border-radius:15px;padding:14px 16px;background:#fff;color:var(--ink);font:inherit;font-size:17px;outline:none;resize:vertical}textarea{min-height:145px;line-height:1.55}input:focus,textarea:focus{border-color:#8b7ff0;box-shadow:0 0 0 4px rgba(109,92,231,.11)}.hint{margin:8px 0 0;color:#8992a5;font-size:13px}.go{width:100%;margin-top:18px;padding:15px;border:0;border-radius:15px;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));font:inherit;font-size:17px;font-weight:850;cursor:pointer;box-shadow:0 13px 26px rgba(109,92,231,.23)}.go:hover{transform:translateY(-2px)}.result{display:grid;place-items:center;min-height:135px;margin-top:19px;padding:20px;text-align:center;border-radius:21px;background:linear-gradient(145deg,#f1efff,#f7f4ff);overflow:hidden}.result small{color:#7d7595;font-size:12px;font-weight:850;letter-spacing:.14em;text-transform:uppercase}.result strong{display:block;margin-top:5px;color:#604cda;font-size:clamp(39px,12vw,68px);line-height:1.05;overflow-wrap:anywhere}.name-result strong{font-size:clamp(31px,9vw,52px)}.error{margin:13px 0 0;color:#bb2848;font-size:14px;font-weight:750}.history{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:12px}.history:empty{display:none}.chip{padding:6px 10px;border:1px solid rgba(109,92,231,.12);border-radius:999px;color:#665b91;background:#fff;font-size:13px;font-weight:750}.pop{animation:pop .32s ease}@keyframes pop{45%{transform:scale(1.1)}75%{transform:scale(.97)}}@media(max-width:450px){body{padding:15px}.panel{padding:22px 12px 12px}.fields{grid-template-columns:1fr}.app{border-radius:25px}}</style></head><body>
<main class="shell"><header class="head"><div class="logo">✦</div><div class="badge">Dein Glück entscheidet</div><h1>Zufallsgenerator</h1><p>Zahlen oder Namen mit einem Klick auslosen.</p></header><section class="app"><nav class="tabs" aria-label="Generator auswählen"><button class="tab active" type="button" data-target="zahlen">🔢 Zahl</button><button class="tab" type="button" data-target="namen">👤 Name</button></nav><div class="panel" id="zahlen"><form id="zahlen-form" novalidate><div class="fields"><label>Von<input id="von" type="number" step="1" value="1" required></label><label>Bis<input id="bis" type="number" step="1" value="100" required></label></div><button class="go" type="submit">Zahl auslosen ✨</button><div class="error" id="zahlen-fehler" role="alert" hidden></div></form><div class="result" aria-live="polite"><div><small>Deine Zufallszahl</small><strong id="zahl-ergebnis">?</strong><div class="history" id="zahlen-verlauf"></div></div></div></div>
<div class="panel" id="namen" hidden><form id="namen-form" novalidate><label>Namen<textarea id="namensliste" placeholder="Anna&#10;Ben&#10;Emilia&#10;Noah"></textarea></label><div class="hint">Ein Name pro Zeile oder mit Komma getrennt.</div><button class="go" type="submit">Name auslosen ✨</button><div class="error" id="namen-fehler" role="alert" hidden></div></form><div class="result name-result" aria-live="polite"><div><small>Ausgewählter Name</small><strong id="name-ergebnis">?</strong><div class="history" id="namen-verlauf"></div></div></div></div></section></main><script>
const tabs=[...document.querySelectorAll('.tab')];tabs.forEach(tab=>tab.addEventListener('click',()=>{tabs.forEach(t=>t.classList.toggle('active',t===tab));document.querySelectorAll('.panel').forEach(p=>p.hidden=p.id!==tab.dataset.target)}));
function showResult(element,value,historyId){element.textContent=value;element.classList.remove('pop');void element.offsetWidth;element.classList.add('pop');const box=document.getElementById(historyId),item=document.createElement('span');item.className='chip';item.textContent=value;box.prepend(item);while(box.children.length>5)box.lastElementChild.remove()}
document.getElementById('zahlen-form').addEventListener('submit',e=>{e.preventDefault();const min=Number(von.value),max=Number(bis.value),error=document.getElementById('zahlen-fehler');error.hidden=true;if(!Number.isSafeInteger(min)||!Number.isSafeInteger(max)){error.textContent='Bitte gib zwei ganze Zahlen ein.';error.hidden=false;return}if(min>max){error.textContent='„Von“ darf nicht größer als „Bis“ sein.';error.hidden=false;return}showResult(document.getElementById('zahl-ergebnis'),(Math.floor(Math.random()*(max-min+1))+min).toLocaleString('de-DE'),'zahlen-verlauf')});
document.getElementById('namen-form').addEventListener('submit',e=>{e.preventDefault();const names=document.getElementById('namensliste').value.split(/[\n,;]+/).map(n=>n.trim()).filter(Boolean),error=document.getElementById('namen-fehler');error.hidden=true;if(names.length<2){error.textContent='Bitte gib mindestens zwei Namen ein.';error.hidden=false;return}showResult(document.getElementById('name-ergebnis'),names[Math.floor(Math.random()*names.length)],'namen-verlauf')});
</script></body></html>
